case 'undo':if(toastUndo){let fn=toastUndo;toastUndo=null;fn();document.getElementById('toast').classList.remove('show')}break;
case 'edit-checkin':{let c=checkin();selectedSpoons=c?.spoons||8;selectedSensory=c?.sensory||'med';selectedDrains=[...(c?.drains||[])];selectedRestores=[...(c?.restores||[])];openModal(checkinModal());break}
case 'set-day':{let cyc=document.querySelector('#cycle-day');let c={date:day(),spoons:selectedSpoons,sensory:selectedSensory,mode:suggest(selectedSpoons,selectedSensory),drains:selectedDrains.slice(),restores:selectedRestores.slice(),cycleDay:cyc?.value?Number(cyc.value):null,note:checkin()?.note||''};setCheckin(c);closeModal();render();toast(T('changed'));break}
case 'exit-low':setMode(previousMode==='low'?'structure':previousMode);break;
case 'pin':if(t)saveSnapshotAnd(()=>{t.pinned=!t.pinned});break;
case 'task':if(t)openModal(taskModal(t));break;
case 'add-task':openModal(taskModal(null));break;
case 'focus-task':{view='focus';focusMinutes=25;focusActive=null;render();let select=document.getElementById('focus-task');if(select)select.value=value;break}
case 'nav-focus':navigate('focus');break;
case 'nav-inbox':navigate('inbox');break;
case 'shuffle':flexShuffle++;render();break;
case 'delete-task':if(t&&confirm(T('confirmReset'))){saveSnapshotAnd(()=>{state.tasks=state.tasks.filter(x=>x.id!==value)});closeModal()}break;
case 'move-task-up':case 'move-task-down':{let items=todaysTasks(),i=items.findIndex(x=>x.id===value),j=i+(verb==='move-task-up'?-1:1);if(i<0||j<0||j>=items.length)break;saveSnapshotAnd(()=>{[items[i].order,items[j].order]=[items[j].order,items[i].order]});openModal(taskModal(state.tasks.find(x=>x.id===value)));break}
case 'apply-template':{let template=document.getElementById('break-template')?.value;if(!template||!state.tasks.some(t=>t.id===value))break;saveSnapshotAnd(()=>{state.tasks.find(t=>t.id===value).steps=BREAK_TEMPLATES[template].map((text,i)=>({text,min:5,done:false}))});openModal(taskModal(state.tasks.find(t=>t.id===value)));break}
case 'send-today':if(t)saveSnapshotAnd(()=>{t.day=day();t.someday=false;t.order=Math.max(0,...state.tasks.map(x=>x.order))+1;if(budget().later.some(x=>x.id===t.id))setTimeout(()=>toast(T('overbudget')),0)});break;
case 'send-someday':if(t)saveSnapshotAnd(()=>{t.someday=true;t.day=''});break;
case 'new-routine':openModal(routineModal(null));break;
case 'edit-routine':{let r=state.routines.find(r=>r.id===value);if(r)openModal(routineModal(r));break}
case 'delete-routine':if(confirm(T('confirmReset'))){saveSnapshotAnd(()=>{state.routines=state.routines.filter(r=>r.id!==value)});closeModal()}break;
case 'new-routine-step':updateRoutineModalRow('new',0);break;
case 'routine-row-up':case 'routine-row-down':case 'routine-row-remove':updateRoutineModalRow(verb.replace('routine-row-',''),Number(value));break;
case 'play-routine':{let r=state.routines.find(r=>r.id===value);if(!r)break;routineActive={id:value,started:Date.now(),stepIndex:0,pausedTotal:0,pausedAt:null};render();break}
case 'routine-next':if(routineActive){routineActive.stepIndex++;let r=state.routines.find(r=>r.id===routineActive.id);if(routineActive.stepIndex>=r.steps.length)finishRoutine();else render()}break;
case 'routine-stop':finishRoutine();break;
case 'focus-start':{let sel=document.getElementById('focus-task');focusActive={taskId:sel?.value||'',minutes:focusMinutes,started:Date.now(),pausedTotal:0,pausedAt:null,halfShown:false,remind5:false,remind1:false};render();break}
case 'focus-stop':stopFocus();break;
case 'focus-pause':{if(!focusActive)break;let f=focusActive;if(f.pausedAt){f.pausedTotal+=Date.now()-f.pausedAt;f.pausedAt=null}else f.pausedAt=Date.now();closeModal();render();break}
case 'choose-day':if(t)openModal(chooseDayModal(t));break;
case 'edit-priority':{let p=state.priorities.find(p=>p.id===value);if(p)openModal(priorityModal(p));break}
case 'priority-new-step':{let editor=document.getElementById('priority-editor');if(editor){editor.insertAdjacentHTML('beforeend',`<div class="inline-form" style="margin:7px 0"><label class="checkbox-line"><input type="checkbox" name="done"></label><input name="stepText" required placeholder="${T('stepTitle')}"></div>`) }break}
case 'delete-priority':if(confirm(T('confirmReset'))){saveSnapshotAnd(()=>{state.priorities=state.priorities.filter(p=>p.id!==value)});closeModal()}break;
case 'add-event':openModal(eventModal());break;
case 'delete-event':if(confirm(T('confirmReset')))saveSnapshotAnd(()=>{state.events=state.events.filter(e=>e.id!==value)});break;
case 'export':fileExport();break;
case 'import':{if(DEMO_BUILD){toast('Import is unavailable in the demo version.');break}let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.addEventListener('change',()=>importHandler(inp.files[0]));inp.click();break}
case 'confirm-import':if(window.pendingImport){state=window.pendingImport;window.pendingImport=null;store();closeModal();render();toast(T('changed'))}break;
case 'clear-demo':if(confirm(T('confirmReset'))){let prior=JSON.stringify(state);let opts={...state.settings};state=emptyData();state.settings={...opts,lastExport:null};selectedSpoons=8;selectedSensory='med';store();navigate('today');toast(T('changed'),()=>{state=validateImport(JSON.parse(prior));store();render()})}break;
case 'reset':if(confirm(T('confirmReset'))){let prior=JSON.stringify(state);state=emptyData();selectedSpoons=8;selectedSensory='med';store();navigate('today');toast(T('changed'),()=>{state=validateImport(JSON.parse(prior));store();render()})}break;
case 'dictate':{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;let recognition=new S(),field=el.closest('.capture-form')?.querySelector('[name=capture]');recognition.lang=locale();recognition.onresult=e=>{if(field)field.value=e.results[0][0].transcript};recognition.start();break}
case 'more':openModal(moreModal());break;
}}
function onForm(form){const type=form.dataset.form,fd=new FormData(form);switch(type){
case 'capture':{let title=String(fd.get('capture')||'').trim();if(!title||!demoAllow('tasks'))return;saveSnapshotAnd(()=>state.tasks.push({id:id(),title,spoons:1,pinned:false,category:'Other',day:'',someday:false,done:'',steps:[],weeklyPriorityId:'',order:Math.max(0,...state.tasks.map(t=>t.order))+1}));closeModal();toast(T('captured'));break}
case 'task':{let title=String(fd.get('title')||'').trim();if(!title)return;let task=state.tasks.find(t=>t.id===form.dataset.taskId);if(!task&&!demoAllow('tasks'))return;saveSnapshotAnd(()=>{let props={title,spoons:Number(fd.get('spoons'))||1,category:fd.get('category')||'Other',day:fd.get('day')||'',someday:false};if(task)Object.assign(task,props);else state.tasks.push({id:id(),...props,pinned:false,done:'',steps:[],weeklyPriorityId:'',order:Math.max(0,...state.tasks.map(t=>t.order))+1})});closeModal();break}
case 'step':{let task=state.tasks.find(t=>t.id===form.dataset.taskId),text=String(fd.get('text')||'').trim(),min=Math.max(1,Number(fd.get('min'))||5);if(task&&text){saveSnapshotAnd(()=>{task.steps.push({text,min,done:false})});openModal(taskModal(task))}break}
case 'routine':{let name=String(fd.get('name')||'').trim(),rows=[...form.querySelectorAll('.routine-edit-row')],steps=rows.map(r=>({text:r.querySelector('[name=stepText]').value.trim(),min:Number(r.querySelector('[name=stepMin]').value)||5})).filter(s=>s.text),r=state.routines.find(r=>r.id===form.dataset.routineId);if(!name||!steps.length)return;if(!r&&!demoAllow('routines'))return;saveSnapshotAnd(()=>{if(r){r.name=name;r.steps=steps}else state.routines.push({id:id(),name,kind:'custom',steps})});closeModal();break}
case 'task-day':{let t=state.tasks.find(t=>t.id===form.dataset.taskId);if(t)saveSnapshotAnd(()=>{t.day=String(fd.get('date')||day());t.someday=false});closeModal();break}
case 'priority-edit':{let p=state.priorities.find(p=>p.id===form.dataset.priorityId);if(!p)return;let rows=[...form.querySelectorAll('#priority-editor .inline-form')];saveSnapshotAnd(()=>{p.title=String(fd.get('title')||p.title);p.steps=rows.map(r=>({text:r.querySelector('[name=stepText]').value.trim(),done:r.querySelector('[name=done]').checked})).filter(r=>r.text)});closeModal();break}
case 'event':{let title=String(fd.get('title')||'').trim();if(!title||!demoAllow('events'))return;saveSnapshotAnd(()=>{state.events.push({id:id(),title,date:fd.get('date'),time:fd.get('time'),spoons:Number(fd.get('spoons'))||1})});closeModal();break}
case 'priority':{let title=String(fd.get('title')||'').trim(),week=weekMonday(day());if(!title||state.priorities.filter(p=>p.week===week).length>=3)return;saveSnapshotAnd(()=>{state.priorities.push({id:id(),title,week,steps:[{text:'First tiny step',done:false}]})});break}
case 'evening':{saveSnapshotAnd(()=>{state.eveningLogs[day()]={doneText:String(fd.get('doneText')||''),tomorrowText:String(fd.get('tomorrowText')||''),winText:String(fd.get('winText')||'')}});break}
case 'focus-result':{let result=String(fd.get('result')||'');if(window.pendingSession){state.focusSessions.push({...window.pendingSession,result});window.pendingSession=null;store()}closeModal();render();toast(T('stopped'));break}
}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){const key=nav.dataset.nav;if(key==='more')openModal(moreModal());else navigate(key);return}const spoon=e.target.closest('[data-spoons]');if(spoon){selectedSpoons=Number(spoon.dataset.spoons);document.querySelectorAll('[data-spoons]').forEach(b=>{let i=Number(b.dataset.spoons);b.classList.toggle('on',i>0&&i<=selectedSpoons);b.setAttribute('aria-pressed',String(i===selectedSpoons))});document.querySelectorAll('.pill.light').forEach(p=>{if(p.closest('.card')||p.closest('.modal'))p.textContent=selectedSpoons+' / '+state.settings.maxSpoons});return}const sensory=e.target.closest('[data-sensory]');if(sensory){selectedSensory=sensory.dataset.sensory;document.querySelectorAll('[data-sensory]').forEach(b=>{b.classList.toggle('active',b.dataset.sensory===selectedSensory);b.setAttribute('aria-pressed',String(b.dataset.sensory===selectedSensory))});return}const tag=e.target.closest('[data-tag]');if(tag){const [kind,value]=tag.dataset.tag.split(':'),arr=kind==='drain'?selectedDrains:selectedRestores;let index=arr.indexOf(value);index>=0?arr.splice(index,1):arr.push(value);tag.classList.toggle('active');return}const mode=e.target.closest('[data-mode]');if(mode){setMode(mode.dataset.mode);return}const check=e.target.closest('[data-check]');if(check){let t=state.tasks.find(t=>t.id===check.dataset.check);if(t)saveSnapshotAnd(()=>t.done=t.done?'':day());return}const anchor=e.target.closest('[data-anchor]');if(anchor){let key=day(),v=anchor.dataset.anchor;saveSnapshotAnd(()=>{let list=state.anchorLog[key]||[];state.anchorLog[key]=list.includes(v)?list.filter(x=>x!==v):[...list,v]});return}const focus=e.target.closest('[data-focus-min]');if(focus){focusMinutes=Number(focus.dataset.focusMin);render();return}const comp=e.target.closest('[data-companion]');if(comp){companionIndex=Number(comp.dataset.companion);render();return}const act=e.target.closest('[data-act]');if(act){if(act.type==='submit'&&act.closest('form'))return;onAction(act.dataset.act,act);return}if(e.target.dataset.modal==='backdrop'){closeModal()}});
document.addEventListener('change',e=>{const target=e.target;if(target.matches('[data-setting]')){let key=target.dataset.setting,value=target.value;state.settings[key]=['weekStart','maxSpoons','textSize'].includes(key)?Number(value):value;store();render();return}if(target.matches('[data-toggle]')){let key=target.dataset.toggle;state.settings[key]=target.checked;store();render();return}if(target.matches('[data-step]')){let [taskId,i]=target.dataset.step.split(':'),t=state.tasks.find(t=>t.id===taskId);if(t?.steps[Number(i)]){t.steps[Number(i)].done=target.checked;store();openModal(taskModal(t))}return}if(target.id==='routine-template'){let templ=ROUTINE_TEMPLATES[target.value];if(templ){let name=document.querySelector('.modal [name=name]');if(name)name.value=target.value;let editor=document.getElementById('routine-editor');if(editor)editor.innerHTML=templ.map(([text,min],i)=>routineEditRow({text,min},i)).join('')}return}if(target.matches('[data-priority-step]')){let [pid,i]=target.dataset.priorityStep.split(':'),p=state.priorities.find(p=>p.id===pid);if(p?.steps[Number(i)]){p.steps[Number(i)].done=target.checked;store();render()}}});
document.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(f){e.preventDefault();onForm(f)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});document.addEventListener('toggle',e=>{if(e.target.matches('.not-today'))openNot=e.target.open},true);
function startVideo(){state=demoData();store();selectedSpoons=8;view='today';navigate('today');const actions=[()=>{let c=checkin();state.checkins=state.checkins.filter(x=>x.date!==day());store();navigate('today')},()=>onAction('set-day'),()=>{setMode('flex')},()=>{navigate('routines');let r=state.routines[0];onAction('play-routine:'+r.id)},()=>onAction('routine-next'),()=>onAction('routine-next'),()=>{finishRoutine();navigate('today');setMode('structure')},()=>{let b=budget();if(b.kept[0]){b.kept[0].done=day();store();render()}}];actions.forEach((fn,i)=>setTimeout(fn,[0,1400,2800,4400,6100,6900,8200,9700][i]))}
state=load();selectedSpoons=checkin()?.spoons||8;selectedSensory=checkin()?.sensory||'med';selectedDrains=checkin()?.drains?.slice()||[];selectedRestores=checkin()?.restores?.slice()||[];
if(VIDEO)startVideo();else{const screen=query.get('screen');if(NAV.includes(screen)&&!(DEMO_BUILD&&DEMO_LOCKED.includes(screen)))view=screen;render()}
if(!CAPTURE&&!VIDEO){timer=setInterval(updateClocks,1000)}
/* Expose pure calculations for offline verification, no server or account required. */
window.ADHDLifePlannerTest={budget,insightsData,progress,duration,suggest,day,weekSessions,resetDemo:()=>{state=demoData();store();render()},getState:()=>state,navigate};window.TwofoldTest=window.ADHDLifePlannerTest;


</script></body></html>
